server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access in the containerized deployment — avoids CORS
    # entirely by having the browser talk to nginx, which forwards to the
    # backend container over the compose network.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's own default proxy_read_timeout (60s) is shorter than the
        # backend's AI_SERVICE_TIMEOUT_MS (90s, set for CPU-only inference in
        # docker-compose.yml) — nginx was returning 502/504 on its own before
        # the backend ever got a chance to finish, found by watching a real
        # analysis request through the full containerized stack.
        proxy_connect_timeout 100s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
    }

    location /api-docs {
        proxy_pass http://backend:5000/api-docs;
        proxy_set_header Host $host;
    }
}
