name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            ai_service/requirements.txt
            ai_service/requirements-train.txt
            ai_service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai_service/requirements.txt -r ai_service/requirements-train.txt -r ai_service/requirements-dev.txt

      - name: Run tests
        # -m "not slow": excludes tests that run full model inference or
        # download OCR models.
        run: python -m pytest -m "not slow" -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        # npm install, not npm ci: the lockfile is maintained on Windows and
        # its optionalDependencies resolution for native binaries doesn't
        # always carry over cleanly to ubuntu-latest (same root cause as
        # backend/Dockerfile — see docs/TROUBLESHOOTING.md).
        run: npm install

      - name: Run tests
        working-directory: backend
        # npm test passes --experimental-vm-modules, needed for the ESM-only
        # file-type package used to verify upload signatures.
        run: npm test -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # npm install, not npm ci — see docs/TROUBLESHOOTING.md.
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
